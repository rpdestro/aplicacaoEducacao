<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Contábil e Financeiro - LDO / SIOPS</title>
    
    <!-- Sugestão: Importar uma fonte moderna como 'Inter' -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --success-light: #dcfce7;
            --success: #16a34a;
            --danger-light: #fee2e2;
            --danger: #dc2626;
            --border-color: #e2e8f0;
            --dropzone-bg: #f8fafc;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px 20px;
            color: var(--text-main);
        }

        .hidden { display: none !important; }

        /* --- CABEÇALHO --- */
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .page-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }
        .page-header p {
            font-size: 1rem;
            color: var(--text-muted);
            margin: 0;
        }

        /* --- CARDS DE UPLOAD --- */
        .upload-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
            gap: 24px;
            max-width: 1100px;
            margin: 0 auto 32px auto;
        }

        .upload-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px; /* Bordas mais arredondadas (Moderno) */
            padding: 28px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .upload-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        /* Cabeçalho do Card */
        .card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .icon-box {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .icon-box.receitas { background: var(--success-light); color: var(--success); }
        .icon-box.despesas { background: var(--danger-light); color: var(--danger); }

        .card-title-group h3 {
            margin: 0 0 4px 0;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .card-title-group span {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Área de Dropzone */
        .dropzone {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--dropzone-bg);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .dropzone:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .upload-card.receitas-card:hover .dropzone:hover { border-color: var(--success); background: #f0fdf4; }
        .upload-card.despesas-card:hover .dropzone:hover { border-color: var(--danger); background: #fef2f2; }

        .dropzone svg { margin-bottom: 12px; stroke: #94a3b8; transition: stroke 0.2s ease; }
        .dropzone:hover svg { stroke: var(--primary); }
        
        .dropzone-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
        }
        .dropzone-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Área de Mapeamento (Badges) */
        .mapping-area {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }
        .mapping-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .mapping-badge {
            background: #ffffff;
            color: #475569;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.75rem;
            font-weight: 600;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        /* --- BOTÃO PRINCIPAL --- */
        .btn-wrapper { text-align: center; margin-top: 10px; }
        
        .btn-primary {
            padding: 14px 48px;
            background: linear-gradient(135deg, var(--primary) 0%, #026ca3 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
        }
        .btn-primary:active { transform: translateY(0); }

        /* Estilos legados necessários para as tabelas renderizadas pelo script.js */
        .responsive-table th { background-color: #1e293b; color: white; padding: 12px 10px; font-size: 13px; text-align: left; font-weight: 600; }
        .responsive-table td { padding: 10px; border-bottom: 1px solid var(--border-color); font-size: 13px; color: var(--text-main); background: white; }
        .responsive-table tr:hover td { background-color: #f8fafc; }
        .text-right { text-align: right !important; }
        .btn-filtro-excel { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); color: white; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; display: flex; align-items: center; gap: 4px; transition: background 0.2s; }
        .btn-filtro-excel:hover { background: rgba(255, 255, 255, 0.3); }
        .active-filter { background-color: #f59e0b !important; border-color: #d97706 !important; color: #ffffff !important; font-weight: bold; }
    </style>
</head>
<body>

    <div class="page-header">
        <h2>Departamento de Planejamento e Orçamento</h2>
        <p>Selecione os arquivos CSV de Receitas e Despesas para iniciar as análises</p>
    </div>

    <!-- SEÇÃO DE UPLOAD -->
    <div id="upload-section">
        
        <div class="upload-grid">
            
            <!-- CARD RECEITAS -->
            <div class="upload-card receitas-card">
                <div>
                    <div class="card-header">
                        <div class="icon-box receitas">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
                        </div>
                        <div class="card-title-group">
                            <h3>Receitas</h3>
                            <span>Nat.Despesa R • Descrição K • Valor AB</span>
                        </div>
                    </div>

                    <label for="csv-receitas" class="dropzone" id="drop-zone-receitas">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        <span class="dropzone-title" id="label-receitas">Arraste o CSV ou clique para selecionar</span>
                        <span class="dropzone-subtitle">CSV com até 80 colunas • separador ; ou ,</span>
                        <input type="file" id="csv-receitas" accept=".csv" style="display: none;" onchange="atualizarNomeArquivo('receitas')">
                    </label>
                </div>

                <div class="mapping-area">
                    <span class="mapping-label">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        Mapeamento:
                    </span>
                    <span class="mapping-badge">R=17</span>
                    <span class="mapping-badge">K=10</span>
                    <span class="mapping-badge">AB=27</span>
                </div>
            </div>

            <!-- CARD DESPESAS -->
            <div class="upload-card despesas-card">
                <div>
                    <div class="card-header">
                        <div class="icon-box despesas">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="17" y1="7" x2="7" y2="17"></line><polyline points="17 17 7 17 7 7"></polyline></svg>
                        </div>
                        <div class="card-title-group">
                            <h3>Despesas</h3>
                            <span>BJ • BW • L • N • P</span>
                        </div>
                    </div>

                    <label for="csv-despesas" class="dropzone" id="drop-zone-despesas">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        <span class="dropzone-title" id="label-despesas">Arraste o CSV ou clique para selecionar</span>
                        <span class="dropzone-subtitle">CSV com até 80 colunas • separador ; ou ,</span>
                        <input type="file" id="csv-despesas" accept=".csv" style="display: none;" onchange="atualizarNomeArquivo('despesas')">
                    </label>
                </div>

                <div class="mapping-area">
                    <span class="mapping-label">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        Mapeamento:
                    </span>
                    <span class="mapping-badge">BJ=61</span>
                    <span class="mapping-badge">BW=74</span>
                    <span class="mapping-badge">L=11</span>
                </div>
            </div>

        </div>

        <!-- BOTÃO CARREGAR DADOS -->
        <div class="btn-wrapper">
            <button id="btn-processar" class="btn-primary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                Processar e Carregar Dados
            </button>
        </div>
    </div>

    <!-- DASHBOARD DE RESULTADOS (INJETADO VIA JS) -->
    <div id="dashboard" class="hidden">
        <div id="resultado-status"></div>
    </div>

    <!-- SCRIPT PRINCIPAL -->
    <script src="script.js"></script>
</body>
</html>
